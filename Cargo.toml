[package]
name = "bevy_dice"
version = "0.3.0"
edition = "2024"

[features]
# Each feature embeds the indicated diceset gltf into the binary so callers
# can use it with no asset setup. The textured dicesets (frosty ~95 MB,
# fiery ~76 MB) are deliberately not feature-gated; ship those by writing
# them into your own `assets/` directory.
plain_white = []
halloween = []
metal = []
clear_orange = []

[dependencies]
avian3d = "0.7.0"
# `jpeg` is required because the diceset gltf files embed JPEG textures.
bevy = { version = "0.19", features = ["jpeg"] }
rand = "0.8"
# Used only to read the `extras.dice_orientations` JSON block out of diceset
# gltf files. Already in the dependency tree via bevy's gltf loader.
serde_json = "1"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[[example]]
name = "simple_d20"
required-features = ["plain_white"]

[[example]]
name = "dice_expressions"
required-features = ["plain_white"]

[[example]]
name = "isolated_layer"
required-features = ["plain_white"]

[[example]]
name = "two_arenas"
required-features = ["plain_white", "halloween"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
