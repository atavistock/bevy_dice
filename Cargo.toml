[package]
name = "bevy_dice"
version = "0.4.0"
edition = "2024"

[features]
# Each feature embeds the indicated diceset gltf into the binary so callers
# can use it with no asset setup. The textured dicesets (frosty ~95 MB,
# fiery ~76 MB) are deliberately not feature-gated; ship those by writing
# them into your own `assets/` directory.
plain_white = []
halloween = []
metal = []
clear_orange = []

[dependencies]
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "parallel"] }
# Bundled dicesets contain both JPEG and PNG textures.
bevy = { version = "0.19", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_gltf", "bevy_pbr", "jpeg", "png"] }
rand = "0.8"
# Used only to read the `extras.dice_orientations` JSON block out of diceset
# gltf files. Already in the dependency tree via bevy's gltf loader.
serde_json = "1"

[dev-dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_winit", "bevy_log", "bevy_ui_render", "bevy_gizmos_render", "default_font", "tonemapping_luts", "zstd_rust", "x11", "wayland"] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[[example]]
name = "simple_d20"
required-features = ["plain_white"]

[[example]]
name = "dice_expressions"
required-features = ["plain_white"]

[[example]]
name = "isolated_layer"
required-features = ["plain_white"]

[[example]]
name = "two_arenas"
required-features = ["plain_white", "halloween"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
